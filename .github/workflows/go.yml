name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
      id: go

    - name: Check out code
      uses: actions/checkout@v4

    - name: Get dependencies
      run: go mod download

    - name: Build
      run: CGO_ENABLED=0 go build -ldflags="-s -w" -o shhgit .

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: shhgit-linux-amd64
        path: shhgit
