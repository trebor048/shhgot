name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast gate: formatting, vet, tests and the race detector on one runner.
  test:
    name: Format, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Single source of truth: the `go` directive in go.mod.
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l . || true)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Test with race detector
        run: CGO_ENABLED=1 go test ./... -count=1 -race

  # Prove the suite passes and the binary runs on every supported OS, not just
  # the cross-compile host. The race detector stays in the ubuntu job above
  # because it needs cgo, which is not guaranteed on the Windows runners.
  test-os:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Build and smoke test the native binary
        shell: bash
        run: |
          ext=""
          [ "${RUNNER_OS}" = "Windows" ] && ext=".exe"
          go build -trimpath -ldflags="-s -w" -o "shhgit-smoke${ext}" ./cmd/shhgit
          "./shhgit-smoke${ext}" -h 2>&1 | grep -i usage
          echo "native binary on ${RUNNER_OS} runs and lists its flags"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        goos: [ linux, windows, darwin ]
        goarch: [ amd64, arm64 ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" \
            -o "dist/shhgit-${GOOS}-${GOARCH}${ext}" ./cmd/shhgit
          ls -lh dist

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: shhgit-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

      # Only the linux binary can execute on this linux runner; the other five
      # targets are exercised natively by the test-os job above.
      - name: Smoke test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: ./dist/shhgit-linux-amd64 -h 2>&1 | grep -i usage
