# ===========================================================================
# shhgit — Docker Compose
#
#   1. cp config.yaml.example config.yaml    # then add your GitHub token(s)
#   2. cp .env.example .env                  # optional (port, DeepSeek key)
#   3. docker compose up -d
#
#   Dashboard: http://localhost:8080
#
# config.yaml MUST exist before `docker compose up`. If it does not, Docker
# creates a directory with that name and the container cannot read it.
# ===========================================================================

services:
  shhgit:
    build:
      context: .
    image: shhgit:local
    container_name: shhgit
    command:
      - --web
      - --web-host
      - 0.0.0.0
      - --web-port
      - "8080"
      - --config-path
      - /app
    ports:
      # Published on loopback only. The dashboard has no authentication, so it
      # must not be reachable from the network by default. Change to
      # "${SHHGIT_PORT:-8080}:8080" if you really want LAN access.
      - "127.0.0.1:${SHHGIT_PORT:-8080}:8080"
    environment:
      # The environment variables this file passes through from .env. The binary
      # also reads the SHHGIT_AI_* forms (see .env.example); they are listed here so
      # a .env file works without editing this file, and an unset one is simply
      # empty. GitHub tokens, webhooks and signatures come from config.yaml.
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SHHGIT_AI_PROVIDER=${SHHGIT_AI_PROVIDER:-}
      - SHHGIT_AI_API_KEY=${SHHGIT_AI_API_KEY:-}
      - SHHGIT_AI_BASE_URL=${SHHGIT_AI_BASE_URL:-}
      - SHHGIT_AI_MODEL=${SHHGIT_AI_MODEL:-}
    volumes:
      # Mounted read-write on purpose: shhgit prunes revoked (HTTP 401) GitHub
      # tokens from this file at startup and writes a config.yaml.bak backup.
      - ./config.yaml:/app/config.yaml
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: publish the dashboard through a Cloudflare Tunnel instead of
  # exposing a port. Needs CLOUDFLARE_TUNNEL_TOKEN in .env
  #
  #   docker compose --profile tunnel up -d
  #
  # A tunnel makes the dashboard reachable from the internet. There is no
  # authentication on it — put Cloudflare Access in front of it if you use this.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: shhgit-tunnel
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      shhgit:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - tunnel
